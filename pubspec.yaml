name: field_visit_log
description: A field visit logging app with offline-first architecture.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # Networking
  http: ^1.2.2

  # Connectivity
  connectivity_plus: ^6.1.1

  # Background sync
  workmanager: ^0.5.2

  # Image picker
  image_picker: ^1.1.2

  # Unique IDs
  uuid: ^4.5.1

  # Intl for date formatting
  intl: ^0.19.0

  cupertino_icons: ^1.0.8
  sqflite_common_ffi_web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
